{% extends 'platform/base.html' %}{% block content %}<div class="card narrow"><p>Use the account provided by your school administrator.</p>
{% if error %}<div class="notice danger" role="alert">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="email">Staff email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username">
<label for="password">Password</label><input id="password" name="password" type="password" required maxlength="1024" autocomplete="current-password">
<p><button>Sign in</button></p></form><p class="muted">For a password reset, contact your school administrator.</p></div>{% endblock %}
