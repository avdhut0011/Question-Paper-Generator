{% extends 'platform/base.html' %}{% block content %}<div class="card narrow">{% if current_user.must_change_password %}<p>Set your own password before using the platform.</p>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password<input name="current_password" type="password" autocomplete="current-password" required></label>
<label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
<label>Confirm new password<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></label>
<p class="muted">At least 12 characters. Changing your password signs out other sessions.</p><button>Update password</button></form></div>{% endblock %}
